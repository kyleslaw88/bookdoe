# Android: unit tests, a debug APK and lint on every push/PR that touches
# android/. The release job builds a signed AAB and uploads it to the Play internal
# track only when the signing secrets exist (tag v* or manual dispatch); it skips
# cleanly otherwise. No secret value lives in this file or in the repo.
name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Build a signed release AAB (and upload to Play when the service account secret exists)"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, debug APK, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Unit tests, debug build, lint
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bookdoe-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/core/build/reports/tests
            android/app/build/reports
          if-no-files-found: ignore

  release:
    name: Signed release AAB and Play internal track
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    defaults:
      run:
        working-directory: android
    env:
      # Repository secrets (Settings > Secrets and variables > Actions):
      #   ANDROID_KEYSTORE_BASE64         the upload keystore (.jks), base64-encoded
      #   ANDROID_KEYSTORE_PASSWORD       its store password
      #   ANDROID_KEY_ALIAS               the key alias inside it
      #   ANDROID_KEY_PASSWORD            the key password
      #   PLAY_SERVICE_ACCOUNT_JSON       (optional) Play Console service-account JSON;
      #                                   without it the AAB is only kept as an artifact
      HAVE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
      HAVE_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ "$HAVE_SIGNING" != "true" ]; then
            echo "Signing secrets are not configured; skipping the release build."; exit 0
          fi
      - uses: actions/setup-java@v4
        if: env.HAVE_SIGNING == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAVE_SIGNING == 'true'
      - name: Write the keystore to a temporary file
        if: env.HAVE_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "BOOKDOE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build signed release AAB
        if: env.HAVE_SIGNING == 'true'
        env:
          BOOKDOE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BOOKDOE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BOOKDOE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:bundleRelease
      - name: Upload release AAB
        if: env.HAVE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bookdoe-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload to the Play internal track
        if: env.HAVE_SIGNING == 'true' && env.HAVE_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bookdoe.app   # TODO(maintainer): the real application id
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
      - name: Remove the keystore
        if: always() && env.HAVE_SIGNING == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"
