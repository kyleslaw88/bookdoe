# iOS: package tests and a simulator build on every push/PR that touches ios/;
# TestFlight upload only on a tag (v*) or manual dispatch, and only when the
# signing secrets exist. No secret value lives in this file or in the repo.
name: ios

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (needs the signing secrets)"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: BookdoeKit swift test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: swift test
        working-directory: ios/Packages/BookdoeKit
        run: swift test --parallel

  simulator-build:
    name: xcodebuild (simulator)
    runs-on: macos-15
    needs: package-tests
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build for simulator
        working-directory: ios
        run: |
          xcodebuild -project Bookdoe.xcodeproj -scheme Bookdoe \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            build | xcpretty && exit ${PIPESTATUS[0]}
      - name: Check scene manifest (phone and CarPlay)
        working-directory: ios
        run: |
          sh scripts/test-check-scene-manifest.sh
          APP="$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 6 -ipath '*Debug-iphonesimulator/bookdoe.app' | head -1)"
          test -n "$APP"
          sh scripts/check-scene-manifest.sh "$APP"

  testflight:
    name: TestFlight upload
    runs-on: macos-15
    needs: simulator-build
    # Tag pushes and manual runs only; the job also exits early when secrets are absent.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload)
    env:
      # All of these are repository secrets (Settings > Secrets and variables > Actions):
      #   APPLE_TEAM_ID                 10-character team id
      #   ASC_KEY_ID, ASC_ISSUER_ID     App Store Connect API key id and issuer id
      #   ASC_KEY_P8_BASE64             the .p8 private key, base64-encoded
      #   DIST_CERT_P12_BASE64          Apple Distribution certificate (.p12), base64
      #   DIST_CERT_PASSWORD            its password
      #   PROVISIONING_PROFILE_BASE64   App Store provisioning profile (.mobileprovision), base64
      #   BUNDLE_ID                     e.g. com.yourname.bookdoe
      #   BOOKDOE_PINNED_HOSTS      optional, comma separated host(s) to pin; empty = no pinning
      HAVE_SECRETS: ${{ secrets.ASC_KEY_ID != '' && secrets.DIST_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ "$HAVE_SECRETS" != "true" ]; then
            echo "Signing secrets are not configured; skipping upload."; exit 0
          fi
      - name: Select Xcode
        if: env.HAVE_SECRETS == 'true'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install XcodeGen
        if: env.HAVE_SECRETS == 'true'
        run: brew install xcodegen
      - name: Import signing material into a temporary keychain
        if: env.HAVE_SECRETS == 'true'
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/bookdoe.mobileprovision
          rm -f "$RUNNER_TEMP/dist.p12"
      - name: Write App Store Connect API key
        if: env.HAVE_SECRETS == 'true'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Generate project
        if: env.HAVE_SECRETS == 'true'
        working-directory: ios
        run: xcodegen generate
      - name: Verify provisioning profile carries the CarPlay entitlement
        if: env.HAVE_SECRETS == 'true'
        run: |
          set -eu
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/bookdoe.mobileprovision > "$RUNNER_TEMP/profile.plist"
          sh ios/scripts/check-carplay-profile.sh "$RUNNER_TEMP/profile.plist"
          rm -f "$RUNNER_TEMP/profile.plist"
      - name: Archive
        if: env.HAVE_SECRETS == 'true'
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          PINNED_HOSTS: ${{ secrets.BOOKDOE_PINNED_HOSTS }}
        run: |
          xcodebuild -project Bookdoe.xcodeproj -scheme Bookdoe -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Bookdoe.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" BOOKDOE_PINNED_HOSTS="$PINNED_HOSTS" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/bookdoe.mobileprovision)")" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | xcpretty && exit ${PIPESTATUS[0]}
      - name: Export and upload
        if: env.HAVE_SECRETS == 'true'
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Bookdoe.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -allowProvisioningUpdates | xcpretty && exit ${PIPESTATUS[0]}
      - name: Clean up keys
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys "$RUNNER_TEMP/build.keychain-db" "$RUNNER_TEMP/dist.p12" 2>/dev/null || true
